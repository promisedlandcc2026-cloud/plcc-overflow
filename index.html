<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#04241a">
  <title>Prayer Overflow | PLCC Sanctum</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./overflow.mjs" type="module"></script>
</head>
<body>
  <div class="overflow-entry">
    <header class="overflow-entry-header">
      <div class="overflow-entry-brand">
        <img src="./assets/prayer-emblem.png" alt="" width="276" height="140">
        <div>PLCC <strong>Sanctum</strong></div>
      </div>
      <a id="back" class="overflow-entry-back" href="https://plcc-chat.vercel.app">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7M5 12h14"/></svg>
        Back to Ka Link
      </a>
    </header>
    <main class="overflow-entry-card">
      <p id="status" class="overflow-entry-status" role="status">Prayer overflow</p>
      <h1 id="gathering">Ka Link</h1>
      <p class="overflow-entry-subtitle">Prayer Overflow</p>
      <p id="description" class="overflow-entry-description">When your gathering is full, open its overflow from Ka Link.</p>
      <div class="overflow-entry-form">
        <button id="join" type="button" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 14v-3a9 9 0 0 1 18 0v3M3 14h2a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H4a1 1 0 0 1-1-1zm18 0h-2a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h1a1 1 0 0 0 1-1z"/></svg>
          Join Overflow
        </button>
      </div>
      <p class="overflow-entry-audio">Audio only · Join muted</p>
    </main>
  </div>
</body>
</html>
