<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>PLCC Ka Link</title>
<script>
  // Retired Nov 25 2026. Overflow now happens inside Ka Link: when a prayer room is full,
  // members are moved into the overflow room automatically. Old links land back in Ka Link.
  (function () {
    var ch = new URLSearchParams(location.search).get('channel');
    var base = 'https://plcc-chat.vercel.app/community/chat';
    location.replace(ch ? base + '/' + encodeURIComponent(ch.trim()) : base);
  })();
</script>
</head>
<body style="font-family:system-ui,sans-serif;text-align:center;padding:3rem 1rem">
  <p>Taking you to <a href="https://plcc-chat.vercel.app/community/chat">PLCC Ka Link</a>…</p>
</body>
</html>
